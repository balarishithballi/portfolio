<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Cyber Daily — Live Blog</title>
  <meta name="color-scheme" content="dark" />
  <style>
    :root{
      --bg:#0b0f14; --panel:#0f1624cc; --glass:rgba(20,30,50,0.35);
      --neon:#00ffc3; --neon2:#7a5cff; --accent:#18ff6d; --text:#d7e1ec;
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0; background:#0b0f14; color:var(--text);
      font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x:hidden}
    body::before{content:""; position:fixed; inset:0; pointer-events:none;
      background:repeating-linear-gradient(180deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px); mix-blend-mode:overlay}
    #grid-canvas{position:fixed; inset:0; z-index:0; opacity:.12}
    .glass{background:var(--glass); backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%); border:1px solid rgba(0,255,200,.25); border-radius:14px}
    .wrapper{max-width:1100px; margin:22px auto 40px; padding:0 16px; position:relative; z-index:1}
    .hero{padding:22px 16px; text-align:center; margin-bottom:16px}
    .deck{opacity:.9; margin:8px auto 0; max-width:780px}
    .neon-glitch{display:inline-block; font-weight:800; font-size:clamp(32px,6.8vw,78px);
      color:#e9fffb; text-shadow:0 0 10px var(--neon), 0 0 30px var(--neon); position:relative; letter-spacing:.03em}
    .neon-glitch::before,.neon-glitch::after{content:attr(data-text); position:absolute; left:0; top:0; width:100%}
    .neon-glitch::before{left:2px; text-shadow:-2px 0 var(--neon2);
      clip-path:polygon(0 2%,100% 0,100% 40%,0 38%); animation:glTop 3s infinite linear alternate}
    .neon-glitch::after{left:-2px; text-shadow:2px 0 var(--accent);
      clip-path:polygon(0 62%,100% 60%,100% 100%,0 100%); animation:glBot 3.4s infinite linear alternate}
    @keyframes glTop{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}
    @keyframes glBot{0%{transform:translate(0,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(1px,-1px)}}
    .ticker{margin:12px auto 0; display:flex; align-items:center; gap:12px; padding:10px 14px; position:sticky; top:10px; z-index:5}
    .ticker .label{color:var(--neon); font-weight:700; text-transform:uppercase; letter-spacing:.08em}
    .ticker .track{overflow:hidden; white-space:nowrap; flex:1; position:relative}
    .ticker .row{display:inline-block; padding-left:100%; animation:scroll 28s linear infinite}
    .ticker a{color:var(--text); text-decoration:none; margin:0 18px}
    .ticker a:hover{color:var(--neon)}
    @keyframes scroll{from{transform:translateX(0)} to{transform:translateX(-100%)}}
    .grid{display:grid; grid-template-columns:1.2fr .8fr; gap:24px; margin-top:16px}
    @media (max-width:960px){.grid{grid-template-columns:1fr}}
    .card{padding:22px}
    h2{margin-top:0; font-family:"Orbitron", system-ui, sans-serif; text-shadow:0 0 10px rgba(122,92,255,.6)}
    .list{list-style:none; margin:0; padding:0}
    .item{margin:8px 0; padding:10px 12px; border:1px solid rgba(255,255,255,.08); border-radius:10px; background:rgba(10,20,30,.25)}
    .item a{color:var(--neon); text-decoration:none}
    .meta{font-size:12px; opacity:.75}
    .footer{margin:26px auto 40px; padding:16px; text-align:center}
    .status{font-size:12px; opacity:.8; margin-top:8px}
    .toast{position:fixed; right:12px; bottom:12px; background:#1a2434; color:#cee9ff; border:1px solid rgba(255,255,255,.2); padding:10px 12px; border-radius:10px; max-width:320px}
    a:focus,button:focus{outline:2px solid var(--neon2); outline-offset:2px}
  </style>
</head>
<body>
  <canvas id="grid-canvas" aria-hidden="true"></canvas>

  <div class="wrapper">
    <header class="hero glass">
      <h1 class="neon-glitch" data-text="Cyber Daily">Cyber Daily</h1>
      <p class="deck">Auto-updating cybersecurity headlines and advisories — refreshes every 30 minutes. Uses same-origin APIs to avoid CORS/rate limits.</p>
      <div class="ticker glass">
        <span class="label">Live Ticker</span>
        <div id="ticker-track" class="track" aria-live="polite"></div>
      </div>
      <div id="status" class="status"></div>
    </header>

    <section class="grid">
      <article class="glass card">
        <h2>Latest Headlines</h2>
        <ul id="headlines-list" class="list"></ul>
      </article>

      <aside class="glass card">
        <h2>Advisories & Alerts</h2>
        <ul id="advisories-list" class="list"></ul>
      </aside>
    </section>

    <footer class="glass footer">
      <span>Created by BALARISHITH.BALLI • Sources: The Hacker News, SecurityWeek, CyberWire, CISA KEV</span>
    </footer>
  </div>

  <div id="toast" class="toast" style="display:none"></div>

  <script>
    // Same-origin endpoints
    const PROXY = '/api/rss?url=';
    const KEV = '/api/kev';

    const FEEDS = {
      headlines: [
        PROXY + encodeURIComponent('https://feeds.feedburner.com/TheHackersNews'),
        PROXY + encodeURIComponent('https://www.securityweek.com/feed/'),
        PROXY + encodeURIComponent('https://www.cyberwire.com/podcasts/daily-podcast.xml')
      ],
      advisories: [
        // Try CISA advisories (if available), then KEV JSON as a stable fallback
        PROXY + encodeURIComponent('https://www.cisa.gov/cybersecurity-advisories/all.xml'),
        KEV
      ]
    };

    const MAX_HEADLINES = 20, MAX_ADVISORIES = 15, TICKER_ITEMS = 12;
    const REFRESH_MS = 30*60*1000;
    const state = { lastUpdated: null };

    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(()=>{ t.style.display='none' }, 6000);
    }
    function setStatus(ok){
      const s = document.getElementById('status');
      const stamp = state.lastUpdated ? new Date(state.lastUpdated).toLocaleString() : '—';
      s.textContent = ok ? \`Last updated: \${stamp}\` : \`Attempting to update… \${stamp}\`;
    }
    const sanitize = s => (s || '').replace(/<[^>]*>/g, '').trim();
    function pick(it){
      const title = sanitize(it.title || it.name);
      const link = it.link || it.url || '#';
      const source = sanitize(it.author || it.feed?.title || it.source || 'Feed');
      const date = it.pubDate || it.publishedAt || it.updated || it.isoDate || '';
      return { title, link, source, date };
    }
    function relativeTime(ts){
      try{
        const d = new Date(ts);
        const diff = (Date.now() - d.getTime())/1000;
        if(diff < 60) return 'just now';
        if(diff < 3600) return Math.floor(diff/60)+'m ago';
        if(diff < 86400) return Math.floor(diff/3600)+'h ago';
        return d.toLocaleDateString();
      }catch{ return ''; }
    }

    async function fetchFeed(url){
      const r = await fetch(url, { cache:'no-store' });
      if(!r.ok) throw new Error('proxy '+r.status);
      const j = await r.json();
      return j.items || [];
    }

    async function loadGroup(urls){
      const bag = [];
      const res = await Promise.allSettled(urls.map(fetchFeed));
      let hadError = false;
      res.forEach(r=>{
        if(r.status==='fulfilled'){ (r.value||[]).forEach(x=> bag.push(pick(x))); }
        else { hadError = true; }
      });
      // dedupe + sort
      const seen = new Set();
      const unique = bag.filter(h=>{
        const k = (h.title||'').toLowerCase();
        if(seen.has(k)) return false; seen.add(k); return true;
      }).sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
      return { items: unique, hadError };
    }

    function renderList(id, items, limit){
      const el = document.getElementById(id); if(!el) return;
      el.innerHTML = '';
      items.slice(0,limit).forEach(h=>{
        const li = document.createElement('li');
        li.className='item';
        li.innerHTML = \`
          <a href="\${h.link}" target="_blank" rel="noopener">\${h.title}</a>
          <div class="meta">\${h.source} • \${relativeTime(h.date)}</div>\`;
        el.appendChild(li);
      });
      if(items.length===0){
        const li = document.createElement('li');
        li.className='item';
        li.textContent = 'No items right now. Retrying shortly…';
        el.appendChild(li);
      }
    }

    function renderTicker(items){
      const track = document.getElementById('ticker-track'); if(!track) return;
      const row = document.createElement('div');
      row.className='row';
      row.innerHTML = items.slice(0,TICKER_ITEMS).map(h=>\`<a href="\${h.link}" target="_blank" rel="noopener">\${h.title}</a>\`).join(' • ');
      track.innerHTML=''; track.appendChild(row);
    }

    async function refreshAll(){
      setStatus(false);
      try{
        const [{items:headlines, hadError:hErr}, {items:advisories, hadError:aErr}] = await Promise.all([
          loadGroup(FEEDS.headlines),
          loadGroup(FEEDS.advisories)
        ]);
        renderList('headlines-list', headlines, MAX_HEADLINES);
        renderList('advisories-list', advisories, MAX_ADVISORIES);
        renderTicker(headlines);
        state.lastUpdated = Date.now();
        setStatus(true);
        if(hErr || aErr) showToast('Some feeds throttled or unavailable; displayed what was available.');
      }catch(e){
        showToast('All sources failed. Will retry automatically.');
      }
    }

    refreshAll();
    setInterval(refreshAll, REFRESH_MS);

    // Animated grid background
    (function(){
      const c = document.getElementById('grid-canvas'); if(!c) return;
      const ctx = c.getContext('2d'); let w,h,t=0; const DPR = Math.min(window.devicePixelRatio||1,2);
      function resize(){ w=c.width=innerWidth*DPR; h=c.height=innerHeight*DPR; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
      addEventListener('resize',resize); resize();
      function draw(){ ctx.clearRect(0,0,w,h); ctx.strokeStyle='rgba(0,255,195,0.12)'; ctx.lineWidth=1;
        const grid=36, ox=Math.sin(t/1200)*12, oy=Math.cos(t/1400)*12;
        for(let x=ox; x<innerWidth+grid; x+=grid){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,innerHeight); ctx.stroke(); }
        for(let y=oy; y<innerHeight+grid; y+=grid){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(innerWidth,y); ctx.stroke(); }
        t+=16; requestAnimationFrame(draw); }
      draw();
    })();
  </script>
</body>
</html>
